services:
  postgres:
    image: postgres:17
    container_name: deadlock-postgres
    environment:
      POSTGRES_DB: deadlock
      POSTGRES_USER: deadlock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4
    container_name: deadlock-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data:
