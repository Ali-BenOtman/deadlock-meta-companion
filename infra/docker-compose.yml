x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17
    container_name: deadlock-postgres
    environment:
      POSTGRES_DB: deadlock
      POSTGRES_USER: deadlock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: [ "postgres", "-c", "shared_buffers=1GB", "-c", "effective_cache_size=3GB" ]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U deadlock -d deadlock" ]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 3g
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7.4
    container_name: deadlock-redis
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru" ]
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 256m
    restart: unless-stopped
    logging: *default-logging

  backend:
    image: deadlock-backend
    build: ../backend
    container_name: deadlock-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/deadlock?socketTimeout=3600
      SPRING_DATA_REDIS_HOST: redis
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - backend-data:/app/data
    mem_limit: 3g
    restart: unless-stopped
    logging: *default-logging

  caddy:
    image: caddy:2
    container_name: deadlock-caddy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
    mem_limit: 128m
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres-data:
  backend-data:
  caddy-data:
  caddy-config:
