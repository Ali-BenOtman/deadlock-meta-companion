services:
  postgres:
    image: postgres:17
    container_name: deadlock-postgres
    environment:
      POSTGRES_DB: deadlock
      POSTGRES_USER: deadlock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U deadlock -d deadlock" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    container_name: deadlock-redis
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}" ]
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    image: deadlock-backend
    build: ../backend
    container_name: deadlock-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/deadlock?socketTimeout=3600
      SPRING_DATA_REDIS_HOST: redis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

volumes:
  postgres-data:
  backend-data:
