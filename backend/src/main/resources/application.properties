spring.application.name=backend

# Secrets (database password) from infra/.env, never committed
spring.config.import=optional:file:../infra/.env[.properties]

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/deadlock?socketTimeout=3600
spring.datasource.username=deadlock
spring.datasource.password=${POSTGRES_PASSWORD}

# Cache
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=1h

# External data
app.assets.base-url=https://api.deadlock-api.com
app.data.dir=../data

# Scheduled data updates
app.update.enabled=false
app.update.interval=PT3H
app.update.initial-delay=PT1M
app.update.window-days=21

# Stats
app.stats.window-days=14

# Data retention (must stay above app.stats.window-days)
app.retention.days=21